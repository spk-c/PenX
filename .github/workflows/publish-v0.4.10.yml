# One-time 0.4.10 release bootstrap. Runs only when this exact file first lands
# on main. The existing reviewed release.yml handles tests, Windows packages,
# checksums and GitHub Release publication. This file never force-moves a tag.
name: Bootstrap PenX v0.4.10 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.4.10.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: penx-bootstrap-v0.4.10
  cancel-in-progress: false

jobs:
  dispatch-reviewed-release:
    if: github.repository == 'spk-c/PenX'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify exact release versions before tagging
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from penx_app.version import VERSION
          assert VERSION == "0.4.10", f"Unexpected PenX version: {VERSION}"
          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          assert 'version = "0.4.10"' in pyproject
          PY
      - name: Create immutable tag and dispatch tested Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='v0.4.10'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing duplicate publication."
            exit 1
          fi
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag already exists at a different commit; refusing to move it."
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          # A tag created with GITHUB_TOKEN doesn't trigger push-tag workflows;
          # workflow_dispatch is explicitly supported and runs on the same tag.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Dispatched the reviewed Windows release pipeline for $TAG ($GITHUB_SHA)."

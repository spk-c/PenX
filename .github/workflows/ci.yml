name: Offline tests

on:
  # Always validate proposed changes and the exact merged main tip.
  # Concurrency below cancels superseded main runs to bound CI usage.
  # Keep PRs unfiltered so required checks are always reported.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Windows checks run on manual dispatch and release/* PRs, plus tagged builds.
# Ordinary PRs run only the complete Linux offline/test/lint gate.
concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  tests:
    name: tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements.lock.txt
      - name: Install hash-locked runtime dependencies
        run: python -m pip install --disable-pip-version-check --prefer-binary --require-hashes -r requirements.lock.txt
      - name: Verify active runtime uses the locked dependency set
        run: |
          python -m pip check
          python -c "import requests, bs4, reportlab, reportlab.platypus, defusedxml, jsonschema, dotenv, dns.resolver, whois, debian.debian_support, rpm_vercmp, ddgs; print('locked runtime dependencies import successfully')"
      - name: Verify Python syntax
        run: python -m compileall -q penx.py src scripts tests
      - name: Check fatal lint defects
        if: runner.os == 'Linux'
        run: |
          python -m pip install --disable-pip-version-check "ruff>=0.13,<1"
          python -m ruff check --select E9,F63,F7,F82 penx.py src scripts tests
      # One full-tree Ruff and one mypy pass replace duplicated subset checks.
      - name: Full-tree Ruff unused-import gate
        if: runner.os == 'Linux'
        run: python -m ruff check --select F401 src/penx_app
      - name: Full-tree mypy gate
        if: runner.os == 'Linux'
        run: |
          python -m pip install --disable-pip-version-check "mypy>=1.15,<2"
          python -m mypy --follow-imports=skip --ignore-missing-imports --no-incremental src/penx_app
      - name: All offline regression tests
        run: python offline_tests.py
      - name: Measure synthetic refactor baseline
        run: >
          python scripts/refactor_benchmarks.py --runs 3
          --check-thresholds scripts/benchmark_thresholds.json
          --output refactor-benchmark.json
      - name: Upload synthetic baseline
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: refactor-baseline-ubuntu-latest
          path: refactor-benchmark.json
          if-no-files-found: error
          retention-days: 7
      - name: Generate CVE fixture quality report
        run: python cve_quality.py --json > cve-quality-report.json
      - name: Upload CVE quality report
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: cve-quality-ubuntu-latest
          path: cve-quality-report.json
          if-no-files-found: error
          retention-days: 3

  tests-windows:
    name: tests (windows-latest)
    # Normal PRs skip Windows; release/* PRs run real Windows regression tests.
    # Independent physical field acceptance is tracked separately.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install hash-locked runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary --require-hashes -r requirements.lock.txt
          python -m pip check
      - name: Verify Python syntax on Windows
        run: python -m compileall -q penx.py src scripts tests
      - name: All offline regression tests (Windows)
        run: python offline_tests.py
      - name: Windows scanner subprocess and descendant smoke (synthetic)
        # A real hosted Windows process-tree test, NOT Npcap/UAC field acceptance.
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_windows_scanner_integration.py -v
      - name: Measure synthetic refactor baseline (Windows)
        run: >
          python scripts/refactor_benchmarks.py --runs 3
          --check-thresholds scripts/benchmark_thresholds.json
          --output refactor-benchmark.json
      - name: Upload synthetic Windows baseline
        uses: actions/upload-artifact@v7
        with:
          name: refactor-baseline-windows-latest
          path: refactor-benchmark.json
          if-no-files-found: error
          retention-days: 3
      - name: Generate CVE fixture quality report (Windows)
        run: python cve_quality.py --json > cve-quality-report.json

  # Windows packaged smoke runs only on release/* PRs or manual dispatch,
  # and again during tagged builds. Normal PRs conserve Windows minutes.
  windows-package-smoke:
    name: Windows packaged app & installer
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-build.txt
      - name: Install hash-locked runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary --require-hashes -r requirements.lock.txt
          python -m pip check
      - name: Windows portable EXE import smoke test
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary -r requirements-build.txt
          python scripts/build_windows.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          & .\dist\PenX\PenX.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged EXE import/version smoke failed" }
          & .\dist\PenX\PenX.exe --setup-status
          if ($LASTEXITCODE -ne 0) { throw "Packaged EXE setup-status smoke failed" }
      - name: Windows installer build and installed EXE smoke test (manual or release PR)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/'))
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found" }
          $env:PYTHONPATH = 'src'
          $version = python -c "from penx_app.version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "Version lookup failed" }
          & $compiler "/DMyAppVersion=$version" "installer/penx.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          $installer = (Resolve-Path "dist/PenX-Setup-x64.exe").Path
          # Invoke the read-only field-evidence collector on a disposable
          # Windows runner; it must leave every manual acceptance gate NOT RUN.
          $fieldDir = Join-Path $env:RUNNER_TEMP "PenX-Field-Collector-Smoke"
          & powershell -NoProfile -ExecutionPolicy Bypass -File ".\scripts\collect_refactor_field_evidence.ps1" -InstallerPath $installer -OutputDirectory $fieldDir
          if ($LASTEXITCODE -ne 0) { throw "Field collector Windows smoke failed" }
          $fieldFile = Join-Path $fieldDir "FIELD_ACCEPTANCE.md"
          if (-not (Test-Path -LiteralPath $fieldFile)) { throw "No field metadata was created" }
          $fieldContent = Get-Content -LiteralPath $fieldFile -Raw
          if (-not $fieldContent.Contains("Status: NOT SIGNED OFF")) { throw "Collector claimed unsigned field tests passed" }
          if (-not $fieldContent.Contains("Installer SHA256:")) { throw "Collector did not hash the installer" }
          # Validate all 12 rows and mandatory acceptance scenarios without
          # mistaking a generated NOT RUN worksheet for field-test sign-off.
          & python scripts/validate_field_acceptance.py $fieldFile --allow-incomplete
          if ($LASTEXITCODE -ne 0) { throw "Field worksheet matrix validation failed" }
          Remove-Item -LiteralPath $fieldFile -Force

          $smoke = Join-Path $env:RUNNER_TEMP "PenX-PR-Installer-Smoke"
          $install = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$smoke") -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer smoke failed: $($install.ExitCode)" }
          if (-not (Test-Path (Join-Path $smoke ".penx-installed"))) { throw "Installed-mode marker missing" }
          & (Join-Path $smoke "PenX.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Installed EXE version smoke failed" }
          & (Join-Path $smoke "PenX.exe") --setup-status
          if ($LASTEXITCODE -ne 0) { throw "Installed EXE setup-status smoke failed" }
          # Inno Setup must uninstall cleanly without deleting the per-user
          # assessment/configuration folder under LOCALAPPDATA.
          $uninstaller = Join-Path $smoke "unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstaller)) {
            throw "Per-user Inno Setup uninstaller was not installed"
          }
          $userData = Join-Path $env:LOCALAPPDATA "PenX"
          New-Item -ItemType Directory -Path $userData -Force | Out-Null
          $sentinel = Join-Path $userData "ci-uninstall-preserve-$env:GITHUB_RUN_ID.marker"
          [IO.File]::WriteAllText($sentinel, "Keep assessment data during uninstall")
          try {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
            ) -PassThru -Wait
            if ($uninstall.ExitCode -ne 0) {
              throw "Uninstaller failed: $($uninstall.ExitCode)"
            }
            if (Test-Path -LiteralPath (Join-Path $smoke "PenX.exe")) {
              throw "Uninstaller left the installed PenX.exe behind"
            }
            if (-not (Test-Path -LiteralPath $sentinel)) {
              throw "Uninstaller removed the per-user PenX data marker"
            }
          }
          finally {
            # Remove only our unique CI sentinel; never delete real app data.
            Remove-Item -LiteralPath $sentinel -Force -ErrorAction SilentlyContinue
          }


name: Python compatibility contracts

# Four-version compatibility matrix. Runs on demand and on a weekly schedule
# to keep CI minute usage bounded while still catching version drift.
on:
  workflow_dispatch:
  schedule:
    # Weekly compatibility sweep (Sundays ~06:17 UTC).
    - cron: '17 6 * * 0'

permissions:
  contents: read

concurrency:
  group: python-compat-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  compatibility-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install hash-locked dependencies and package
        run: |
          python -m pip install --disable-pip-version-check --prefer-binary --require-hashes -r requirements.lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip check
      - name: Compile all package modules
        run: python -m compileall -q penx.py src scripts tests
      - name: Check core refactor contracts
        run: |
          python tests/test_refactor_contracts.py
          python tests/test_scanner_result_boundary.py
          python -m unittest discover -s tests -p test_offline_harness.py
      - name: Verify installed entrypoints outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -m penx --version
          python -m penx_app --version
          penx --version

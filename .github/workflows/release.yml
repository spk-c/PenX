name: Windows Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    # Only the reviewed, one-time release request can trigger a main build.
    # GitHub ignores path filters for tag pushes.
    paths:
      - '.github/release-requests/v0.6.1.json'
  pull_request:
    paths:
      - 'src/penx_app/version.py'
      - 'pyproject.toml'
      - '.github/workflows/release.yml'
      - 'docs/RELEASE_*_NOTES.md'
  workflow_dispatch:

permissions:
  contents: write

# Supersede stale PR/manual previews, but never cancel a tagged push
# release. Event-specific groups keep tag pushes separate from manual builds.
concurrency:
  group: windows-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  PYTHONUTF8: "1"

jobs:
  linux-release:
    name: Build and verify Linux amd64 release assets
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-build.txt
      - name: Verify one-time main release authorization and immutable parent
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          PYTHONPATH=src python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from penx_app.version import VERSION
          request = json.loads(Path(".github/release-requests/v0.6.1.json").read_text(encoding="utf-8"))
          assert os.environ["GITHUB_REF"] == "refs/heads/main", "release request must be merged into main"
          assert request["schema"] == "penx-one-time-release-v1"
          assert VERSION == request["version"] == "0.6.1"
          assert request["tag"] == "v0.6.1"
          parent = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
          assert parent == request["source_parent_sha"], "base commit moved since approval"
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == os.environ["GITHUB_SHA"]
          print("[OK] One-time release request bound to protected main and expected parent")
          PY
      - name: Assert matching tag, source and Python package version
        run: |
          PYTHONPATH=src python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          from penx_app.version import VERSION
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", VERSION), VERSION
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"PENX_DEB=penx_{VERSION}_amd64.deb\n")
          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert meta["project"]["version"] == VERSION
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == "v" + VERSION
          PY
      - name: Install verified build dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock.txt
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          python -m pip check
      - name: Build Linux amd64 standalone, archive and Debian package
        run: |
          python -m unittest discover -s tests -p test_linux_portability.py -v
          python scripts/build_linux.py
          test -x dist/PenX/PenX
          test -s dist/PenX/_internal/whois/data/public_suffix_list.dat
          dist/PenX/PenX --version
          python scripts/verify_frozen_runtime.py --executable dist/PenX/PenX
          dist/PenX/PenX --check
          test -f dist/PenX/.env.example
          cmp .env.example dist/PenX/.env.example
          python packaging/linux/build_packages.py
          test -s "artifacts/$PENX_DEB"
          test -s artifacts/PenX-Linux-x86_64.tar.gz
          tar -tzf artifacts/PenX-Linux-x86_64.tar.gz | grep -q '^PenX/PenX$'
          dpkg-deb --info "artifacts/$PENX_DEB"
      - name: Debian package install and first-run smoke
        run: |
          sudo dpkg -i "artifacts/$PENX_DEB"
          penx --version
          python scripts/verify_frozen_runtime.py --executable /opt/penx/PenX/PenX
          penx --check
          export XDG_DATA_HOME="$(mktemp -d)"
          penx --setup
          test -s "$XDG_DATA_HOME/PenX/.env"
          test "$(stat -c %a "$XDG_DATA_HOME/PenX/.env")" = 600
          rm -rf "$XDG_DATA_HOME"
          sudo dpkg -r penx
      - name: Kali rolling functional scanner acceptance
        run: |
          docker run --rm --pull=always \
            -v "$PWD/artifacts:/artifacts:ro" \
            -v "$PWD/tests/kali_local_scanner_acceptance.py:/kali_acceptance.py:ro" \
            -v "$PWD/scripts/ci_kali_apt_install.sh:/ci_kali_apt_install.sh:ro" \
            kalilinux/kali-rolling:latest \
            bash -euo pipefail -c 'export DEBIAN_FRONTEND=noninteractive; bash /ci_kali_apt_install.sh /artifacts/penx_*.deb python3 openssl nmap whatweb nikto nuclei httpx-toolkit ffuf katana subfinder; python3 /kali_acceptance.py'
      - name: Hash both Linux release assets
        run: |
          cd artifacts
          sha256sum PenX-Linux-x86_64.tar.gz "$PENX_DEB" > SHA256SUMS-Linux.txt
          sha256sum --check SHA256SUMS-Linux.txt
      - name: Upload Linux release artifacts to the run
        uses: actions/upload-artifact@v7
        with:
          name: PenX-Linux-x86_64
          path: |
            artifacts/PenX-Linux-x86_64.tar.gz
            artifacts/penx_*_amd64.deb
            artifacts/SHA256SUMS-Linux.txt
          if-no-files-found: error
          retention-days: 7

  windows-release:
    needs: linux-release
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements.lock.txt
            requirements-build.txt
      - name: Check release tag matches application version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          python -c "import sys; from penx_app.version import VERSION; assert sys.argv[1] == 'v' + VERSION, f'Release tag {sys.argv[1]} != v{VERSION}'" "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Release tag/version mismatch" }
      - name: Resolve version-specific release asset
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          $version = python -c "from penx_app.version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid application release version"
          }
          "PENX_DEB=penx_${version}_amd64.deb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install build dependencies
        shell: pwsh
        run: |
          # Build-tool dependencies are not yet hash-locked; runtime dependencies are.
          python -m pip install --disable-pip-version-check --prefer-binary -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw "Build dependencies failed" }
          python -m pip install --disable-pip-version-check --prefer-binary --require-hashes -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { throw "Locked runtime dependencies failed" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Dependency conflicts in release build" }
      - name: Run offline regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python offline_tests.py
          if ($LASTEXITCODE -ne 0) { throw "Offline regression suite failed" }
      - name: Generate CVE quality fixture report
        shell: pwsh
        run: |
          python cve_quality.py --json | Out-File -FilePath CVE-QUALITY.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Quality fixture gate failed" }
      - name: Build portable Windows folder
        shell: pwsh
        run: |
          python scripts/build_windows.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          Copy-Item .env.example dist/PenX/.env.example
          New-Item -Type Directory -Force dist/PenX/data | Out-Null
          & .\dist\PenX\PenX.exe --version
          if ($LASTEXITCODE -ne 0) { throw "EXE version smoke test failed" }
          python scripts/verify_frozen_runtime.py --executable dist/PenX/PenX.exe
          if ($LASTEXITCODE -ne 0) { throw "Frozen dependencies mismatch" }
          # No downloads or consent prompts during CI.
          & .\dist\PenX\PenX.exe --setup-status
          if ($LASTEXITCODE -ne 0) { throw "EXE setup-status smoke test failed" }
      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found" }
          $env:PYTHONPATH = 'src'
          $version = python -c "from penx_app.version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "Version lookup failed" }
          & $compiler "/DMyAppVersion=$version" "installer/penx.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }
          if (-not (Test-Path "dist/PenX-Setup-x64.exe")) { throw "Installer missing" }
          $smoke = Join-Path $env:RUNNER_TEMP "PenX-Installer-Smoke"
          $install = Start-Process -FilePath (Resolve-Path "dist/PenX-Setup-x64.exe") -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$smoke") -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer smoke test failed: $($install.ExitCode)" }
          if (-not (Test-Path (Join-Path $smoke ".penx-installed"))) { throw "Installed-mode marker missing" }
          $installedExe = Join-Path $smoke "PenX.exe"
          & $installedExe --version
          if ($LASTEXITCODE -ne 0) { throw "Installed EXE version test failed" }
          python scripts/verify_frozen_runtime.py --executable "$installedExe"
          if ($LASTEXITCODE -ne 0) { throw "Installed dependency versions mismatch" }
          & (Join-Path $smoke "PenX.exe") --setup-status
          if ($LASTEXITCODE -ne 0) { throw "Installed EXE setup-status test failed" }
      - name: Package and checksum
        shell: pwsh
        run: |
          # Windows includes bsdtar; substantially faster than Compress-Archive
          # for PyInstaller onedir's many small files.
          tar.exe -a -cf PenX-Windows-x64.zip -C dist PenX
          if ($LASTEXITCODE -ne 0) { throw "ZIP packaging failed" }
          # Verify it is a readable ZIP and contains the executable.
          python -c "import zipfile; p='PenX-Windows-x64.zip'; z=zipfile.ZipFile(p); assert 'PenX/PenX.exe' in z.namelist(), 'PenX.exe missing'; assert z.testzip() is None, 'Damaged ZIP'; print('[OK] Validated Windows ZIP')"
          if ($LASTEXITCODE -ne 0) { throw "ZIP validation failed" }
          $hash = (Get-FileHash PenX-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PenX-Windows-x64.zip" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          $setupHash = (Get-FileHash dist/PenX-Setup-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  PenX-Setup-x64.exe" | Add-Content -Path SHA256SUMS.txt -Encoding ascii
          Copy-Item dist/PenX-Setup-x64.exe PenX-Setup-x64.exe
      - name: Download Linux assets from successful build
        uses: actions/download-artifact@v7
        with:
          name: PenX-Linux-x86_64
          path: linux-assets
      - name: Verify Linux asset files and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @("PenX-Linux-x86_64.tar.gz", $env:PENX_DEB)
          $lines = @(Get-Content "linux-assets/SHA256SUMS-Linux.txt" -Encoding ascii)
          if ($lines.Count -ne 2) { throw "Linux checksum file must have exactly two entries" }
          foreach ($name in $names) {
            $line = @($lines | Where-Object { $_.EndsWith("  $name") })
            if ($line.Count -ne 1) { throw "Missing or duplicate SHA256 entry: $name" }
            $expected = ($line[0] -split '  ')[0].Trim().ToLowerInvariant()
            if ($expected -notmatch '^[a-f0-9]{64}$') { throw "Invalid checksum" }
            $actual = (Get-FileHash "linux-assets/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($expected -ne $actual) { throw "SHA256 mismatch: $name" }
          }
      # Stage a clean copy of every published asset (the workspace holds
      # duplicates, e.g. dist/PenX-Setup-x64.exe) so the offline bundle
      # verification sees each asset exactly once.
      - name: Generate SBOM, build manifest, and verify the release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Type Directory -Force release-bundle/linux-assets | Out-Null
          Copy-Item PenX-Windows-x64.zip, PenX-Setup-x64.exe, SHA256SUMS.txt release-bundle/
          Copy-Item linux-assets/PenX-Linux-x86_64.tar.gz, linux-assets/$env:PENX_DEB, linux-assets/SHA256SUMS-Linux.txt release-bundle/linux-assets/
          $env:PYTHONPATH = 'src'
          $manifestRef = $env:GITHUB_REF_NAME
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'branch') {
            $manifestRef = 'v0.6.1'
          }
          python release_supply_chain.py sbom --output release-bundle/PenX-SBOM.json
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed" }
          python release_supply_chain.py manifest --output release-bundle/PenX-BUILD-MANIFEST.json --sbom release-bundle/PenX-SBOM.json --asset release-bundle/PenX-Windows-x64.zip --asset release-bundle/PenX-Setup-x64.exe --asset release-bundle/linux-assets/PenX-Linux-x86_64.tar.gz --asset release-bundle/linux-assets/$env:PENX_DEB --ref "$manifestRef"
          if ($LASTEXITCODE -ne 0) { throw "Build manifest generation failed" }
          $version = python -c "from penx_app.version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { throw "Version lookup failed" }
          python release_supply_chain.py verify-release release-bundle --expect-version "$version" --expect-commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Release bundle verification failed" }
      # Tagged releases already store the ZIP/quality report permanently.
      # Keep a short-lived Actions artifact only for manual preview runs.
      - name: Upload manual workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: PenX-Windows-x64
          path: |
            PenX-Windows-x64.zip
            PenX-Setup-x64.exe
            SHA256SUMS.txt
            CVE-QUALITY.json
            release-bundle/PenX-SBOM.json
            release-bundle/PenX-BUILD-MANIFEST.json
          if-no-files-found: error
          retention-days: 3
      - name: Publish the explicitly approved v0.6.1 release (or a tagged release)
        if: github.ref_type == 'tag' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          # For the approved one-time main push, create the immutable tag only
          # AFTER the Windows/Linux build and complete SHA-256/SBOM validation.
          if ($env:GITHUB_REF_TYPE -eq 'branch') {
            $request = Get-Content '.github/release-requests/v0.6.1.json' -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($env:GITHUB_EVENT_NAME -ne 'push' -or $env:GITHUB_REF_NAME -ne 'main' -or
                $request.schema -ne 'penx-one-time-release-v1' -or $request.tag -ne 'v0.6.1') {
              throw "Not the explicitly approved v0.6.1 main release"
            }
            $parent = (git rev-parse "$($env:GITHUB_SHA)^").Trim()
            if ($LASTEXITCODE -ne 0 -or $parent -ne $request.source_parent_sha) {
              throw "Main parent has changed since release approval"
            }
            $env:TAG = $request.tag
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$env:TAG" -f "sha=$env:GITHUB_SHA" --silent
            if ($LASTEXITCODE -ne 0) { throw "Refusing to create or move release tag; inspect existing refs" }
            $tagSha = (gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:TAG" --jq '.object.sha').Trim()
            if ($LASTEXITCODE -ne 0 -or $tagSha -ne $env:GITHUB_SHA) { throw "Created tag has wrong SHA" }
          }
          else {
            if ($env:GITHUB_REF_TYPE -ne 'tag') { throw "Not a release tag" }
          }
          # Generate a changelog, then prepend clear download guidance to the release body.
          # GitHub's Assets retain their stable filenames for the in-app updater.
          $generated = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$env:TAG" --jq '.body'
          if ($LASTEXITCODE -ne 0) { throw "Could not generate GitHub release notes" }
          $guide = Get-Content ".github/RELEASE_DOWNLOAD_GUIDE.md" -Raw -Encoding UTF8
          if (-not $guide.Contains("penx-download-options-v1")) { throw "Release download guide missing" }
          # The Debian asset includes the version in its filename. Render the
          # version-specific link before adding the guide to release notes.
          $guideVersion = python -c "from penx_app.version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0 -or $guideVersion -notmatch '^\d+\.\d+\.\d+
          $notesFile = "docs/RELEASE_$($env:TAG.Substring(1))_NOTES.md"
          if (Test-Path -LiteralPath $notesFile) {
            $highlights = (Get-Content -LiteralPath $notesFile -Raw -Encoding UTF8).Trim()
            if (-not $highlights.Contains("NOT SIGNED OFF")) {
              throw "Version-specific release notes must state field acceptance limits"
            }
            $body = $guide.TrimEnd() + [Environment]::NewLine + [Environment]::NewLine +
                    $highlights + [Environment]::NewLine + [Environment]::NewLine +
                    "## Automatically generated change list" + [Environment]::NewLine +
                    ($generated -join [Environment]::NewLine)
          }
          else {
            $body = $guide.TrimEnd() + [Environment]::NewLine + [Environment]::NewLine +
                    ($generated -join [Environment]::NewLine)
          }
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "RELEASE-NOTES.md"), $body, [System.Text.UTF8Encoding]::new($false))
          gh release create "$env:TAG" PenX-Windows-x64.zip PenX-Setup-x64.exe SHA256SUMS.txt CVE-QUALITY.json linux-assets/PenX-Linux-x86_64.tar.gz linux-assets/$env:PENX_DEB linux-assets/SHA256SUMS-Linux.txt release-bundle/PenX-SBOM.json release-bundle/PenX-BUILD-MANIFEST.json --verify-tag --title "PenX $env:TAG" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }
) { throw "Invalid guide version" }
          $guide = $guide.Replace("{{PENX_VERSION}}", $guideVersion)
          if ($guide.Contains("{{PENX_VERSION}}")) { throw "Unrendered download guide placeholder" }
          $notesFile = "docs/RELEASE_$($env:TAG.Substring(1))_NOTES.md"
          if (Test-Path -LiteralPath $notesFile) {
            $highlights = (Get-Content -LiteralPath $notesFile -Raw -Encoding UTF8).Trim()
            if (-not $highlights.Contains("NOT SIGNED OFF")) {
              throw "Version-specific release notes must state field acceptance limits"
            }
            $body = $guide.TrimEnd() + [Environment]::NewLine + [Environment]::NewLine +
                    $highlights + [Environment]::NewLine + [Environment]::NewLine +
                    "## Automatically generated change list" + [Environment]::NewLine +
                    ($generated -join [Environment]::NewLine)
          }
          else {
            $body = $guide.TrimEnd() + [Environment]::NewLine + [Environment]::NewLine +
                    ($generated -join [Environment]::NewLine)
          }
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "RELEASE-NOTES.md"), $body, [System.Text.UTF8Encoding]::new($false))
          gh release create "$env:TAG" PenX-Windows-x64.zip PenX-Setup-x64.exe SHA256SUMS.txt CVE-QUALITY.json linux-assets/PenX-Linux-x86_64.tar.gz linux-assets/$env:PENX_DEB linux-assets/SHA256SUMS-Linux.txt release-bundle/PenX-SBOM.json release-bundle/PenX-BUILD-MANIFEST.json --verify-tag --title "PenX $env:TAG" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }

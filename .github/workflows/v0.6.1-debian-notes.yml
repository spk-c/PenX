name: One-time v0.6.1 Debian release-note link fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-requests/v0.6.1-debian-link.json'

permissions:
  contents: write

jobs:
  correct-published-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify published asset and update only the Debian download row
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.6.1" > release.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(Path(".github/release-requests/v0.6.1-debian-link.json").read_text())
          release = json.loads(Path("release.json").read_text())
          assert request["schema"] == "penx-release-note-edit-v1"
          assert request["tag"] == release["tag_name"] == "v0.6.1"
          assert request["release_id"] == release["id"] == 440690501
          assert request["asset"] == "penx_0.6.1_amd64.deb"
          assets = [a for a in release["assets"] if a["name"] == request["asset"]]
          assert len(assets) == 1 and assets[0]["state"] == "uploaded"
          assert assets[0]["digest"] == "sha256:" + request["asset_sha256"]
          assert release["draft"] is False

          guide = Path(".github/RELEASE_DOWNLOAD_GUIDE.md").read_text()
          assert guide.count("{{PENX_VERSION}}") == 3
          row = next(line for line in guide.splitlines() if line.startswith("| **Kali / Debian / Ubuntu (amd64)**"))
          new_row = row.replace("{{PENX_VERSION}}", "0.6.1")
          old_row = (
              "| **Kali / Debian / Ubuntu (amd64)** | Debian package | "
              "Find `penx_<version>_amd64.deb` under "
              "[release assets](https://github.com/spk-c/PenX/releases/latest) |"
          )
          body = release["body"]
          assert "<!-- penx-download-options-v1 -->" in body
          if new_row in body:
              print("[OK] Direct Debian download link already present")
              Path("release-notes.updated.md").write_text(body, encoding="utf-8")
          else:
              assert body.count(old_row) == 1, "Unexpected release notes; refusing to change"
              Path("release-notes.updated.md").write_text(body.replace(old_row, new_row), encoding="utf-8")
              print("[OK] Prepared exact one-row release description correction")
          PY
          gh release edit v0.6.1 --notes-file release-notes.updated.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.6.1" > verified.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path("verified.json").read_text())["body"]
          expected = Path("release-notes.updated.md").read_text(encoding="utf-8")
          assert actual == expected, "Published release body does not match approved correction"
          assert "[penx_0.6.1_amd64.deb](https://github.com/spk-c/PenX/releases/download/v0.6.1/penx_0.6.1_amd64.deb)" in actual
          print("[OK] Published Debian download link confirmed")
          PY

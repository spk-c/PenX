stages:
  - test

offline-tests:
  stage: test
  image: python:3.13-slim
  script:
    - python -m pip install --disable-pip-version-check --prefer-binary --require-hashes -r requirements.lock.txt
    - python -m compileall -q penx.py src scripts tests
    - python offline_tests.py
    - python scripts/validate_distributions.py

lint:
  stage: test
  image: python:3.13-slim
  script:
    - python -m pip install 'ruff>=0.13,<1'
    - python -m ruff check --select E9,F63,F7,F82 penx.py src scripts tests

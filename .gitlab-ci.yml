# GitLab Linux CI only. Windows packaging/release needs a trusted Windows runner.
stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never

default:
  image: python:3.13-slim
  interruptible: true
  cache:
    key: penx-python-dependencies
    paths:
      - .cache/pip/
  before_script:
    - python --version
    - python -m pip install --disable-pip-version-check --prefer-binary --require-hashes -r requirements.lock.txt

offline-tests:
  stage: test
  timeout: 25m
  script:
    - python -m pip check
    - python -m compileall -q penx.py src scripts tests
    - python offline_tests.py
    - python scripts/validate_distributions.py

code-safety-lint:
  stage: test
  timeout: 10m
  script:
    - python -m pip install --disable-pip-version-check 'ruff>=0.13,<1'
    - python -m ruff check --select E9,F63,F7,F82 penx.py src scripts tests

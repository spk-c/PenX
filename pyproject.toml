[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "penx"
version = "0.4.11"
description = "Windows-first security reconnaissance and evidence-based local AI review"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
dynamic = ["dependencies"]

[project.scripts]
penx = "penx_app.bootstrap:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["penx", "penx.*", "penx_app", "penx_app.*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
follow_imports = "skip"
ignore_missing_imports = true
